name: Gerar APK Notifica

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. BAIXAR PROJETO
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # ============================================================
      # 3. NODE
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 4. CRIAR PROJETO CAPACITOR
      # ============================================================
      - name: Criar projeto
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # ============================================================
      # 5. PÁGINA LOCAL MÍNIMA
      # ============================================================
      - name: Criar página mínima
        run: |
          mkdir -p www

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Notifica App</title>
          </head>
          <body>
            <p>Carregando Notifica App...</p>
          </body>
          </html>
          EOF


      # ============================================================
      # 6. CONFIGURAR CAPACITOR (REPOSITÓRIO NOTIFICA)
      # ============================================================
      - name: Configurar Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.almeida.notifica",
            "appName": "Notifica App",
            "webDir": "www",
            "server": {
              "url": "https://almeida-cma.github.io/notifica/",
              "cleartext": false
            }
          }
          EOF


      # ============================================================
      # 7. ADICIONAR PLATAFORMA ANDROID
      # ============================================================
      - name: Adicionar Android
        run: npx cap add android


      # ============================================================
      # 8. ADICIONAR PERMISSÕES NO ANDROIDMANIFEST.XML
      # ============================================================
      - name: Configurar permissões Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",

              # PERMISSÕES OBRIGATÓRIAS DE NOTIFICAÇÃO E VIBRAÇÃO
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",

              # CÂMERA
              "android.permission.CAMERA",

              # LOCALIZAÇÃO / GPS
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",

              # BLUETOOTH BLE
              "android.permission.BLUETOOTH_SCAN",
              "android.permission.BLUETOOTH_CONNECT"
          ]

          for permission in permissions:
              tag = f'    <uses-permission android:name="{permission}" />'
              if tag not in content:
                  content = content.replace("<application", tag + "\n\n    <application", 1)

          manifest.write_text(content)
          print("Permissões de Notificação e Hardware configuradas.")
          PY


      # ============================================================
      # 9. DECLARAR RECURSOS DE HARDWARE OPCIONAIS
      # ============================================================
      - name: Configurar recursos de hardware
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          features = [
              '<uses-feature android:name="android.hardware.camera.any" android:required="false" />',
              '<uses-feature android:name="android.hardware.location.gps" android:required="false" />',
              '<uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />'
          ]

          for feature in features:
              if feature not in content:
                  content = content.replace("<application", "    " + feature + "\n\n    <application", 1)

          manifest.write_text(content)
          print("Hardware opcional configurado.")
          PY


      # ============================================================
      # 10. CONFIGURAR MAINACTIVITY (PACOTE COM.ALMEIDA.NOTIFICA)
      # ============================================================
      - name: Configurar MainActivity Android
        run: |
          cat > android/app/src/main/java/com/almeida/notifica/MainActivity.java <<'EOF'
          package com.almeida.notifica;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private static final int PERMISSION_REQUEST_CODE = 1001;

              private PermissionRequest pendingPermissionRequest;
              private GeolocationPermissions.Callback pendingGeoCallback;
              private String pendingGeoOrigin;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = getBridge().getWebView();

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setGeolocationEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(PermissionRequest request) {
                              runOnUiThread(() -> {
                                  String origin = request.getOrigin().toString();

                                  // Permite apenas a origem do seu GitHub Pages
                                  if (!origin.startsWith("https://almeida-cma.github.io")) {
                                      request.deny();
                                      return;
                                  }

                                  boolean needsCamera = false;
                                  boolean needsMicrophone = false;

                                  for (String resource : request.getResources()) {
                                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {
                                          needsCamera = true;
                                      }
                                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                                          needsMicrophone = true;
                                      }
                                  }

                                  boolean cameraGranted = ContextCompat.checkSelfPermission(
                                      MainActivity.this, Manifest.permission.CAMERA
                                  ) == PackageManager.PERMISSION_GRANTED;

                                  boolean microphoneGranted = ContextCompat.checkSelfPermission(
                                      MainActivity.this, Manifest.permission.RECORD_AUDIO
                                  ) == PackageManager.PERMISSION_GRANTED;

                                  if (needsCamera && !cameraGranted) {
                                      pendingPermissionRequest = request;
                                      ActivityCompat.requestPermissions(
                                          MainActivity.this,
                                          new String[]{Manifest.permission.CAMERA},
                                          PERMISSION_REQUEST_CODE
                                      );
                                      return;
                                  }

                                  if (needsMicrophone && !microphoneGranted) {
                                      pendingPermissionRequest = request;
                                      ActivityCompat.requestPermissions(
                                          MainActivity.this,
                                          new String[]{Manifest.permission.RECORD_AUDIO},
                                          PERMISSION_REQUEST_CODE
                                      );
                                      return;
                                  }

                                  if (needsCamera || needsMicrophone) {
                                      java.util.ArrayList<String> resources = new java.util.ArrayList<>();
                                      for (String resource : request.getResources()) {
                                          if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource) ||
                                              PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                                              resources.add(resource);
                                          }
                                      }
                                      request.grant(resources.toArray(new String[0]));
                                  } else {
                                      request.deny();
                                  }
                              });
                          }

                          @Override
                          public void onGeolocationPermissionsShowPrompt(
                                  String origin,
                                  GeolocationPermissions.Callback callback) {

                              runOnUiThread(() -> {
                                  if (!origin.startsWith("https://almeida-cma.github.io")) {
                                      callback.invoke(origin, false, false);
                                      return;
                                  }

                                  boolean fineGranted = ContextCompat.checkSelfPermission(
                                      MainActivity.this, Manifest.permission.ACCESS_FINE_LOCATION
                                  ) == PackageManager.PERMISSION_GRANTED;

                                  boolean coarseGranted = ContextCompat.checkSelfPermission(
                                      MainActivity.this, Manifest.permission.ACCESS_COARSE_LOCATION
                                  ) == PackageManager.PERMISSION_GRANTED;

                                  if (fineGranted || coarseGranted) {
                                      callback.invoke(origin, true, false);
                                  } else {
                                      pendingGeoOrigin = origin;
                                      pendingGeoCallback = callback;
                                      ActivityCompat.requestPermissions(
                                          MainActivity.this,
                                          new String[]{
                                              Manifest.permission.ACCESS_FINE_LOCATION,
                                              Manifest.permission.ACCESS_COARSE_LOCATION
                                          },
                                          PERMISSION_REQUEST_CODE
                                      );
                                  }
                              });
                          }
                      }
                  );
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {

                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);

                  if (requestCode != PERMISSION_REQUEST_CODE) return;

                  boolean granted = true;
                  for (int result : grantResults) {
                      if (result != PackageManager.PERMISSION_GRANTED) granted = false;
                  }

                  if (pendingPermissionRequest != null) {
                      if (granted) {
                          java.util.ArrayList<String> resources = new java.util.ArrayList<>();
                          for (String resource : pendingPermissionRequest.getResources()) {
                              if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource) ||
                                  PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                                  resources.add(resource);
                              }
                          }
                          pendingPermissionRequest.grant(resources.toArray(new String[0]));
                      } else {
                          pendingPermissionRequest.deny();
                      }
                      pendingPermissionRequest = null;
                  }

                  if (pendingGeoCallback != null) {
                      boolean locationGranted = ContextCompat.checkSelfPermission(
                          this, Manifest.permission.ACCESS_FINE_LOCATION
                      ) == PackageManager.PERMISSION_GRANTED ||
                      ContextCompat.checkSelfPermission(
                          this, Manifest.permission.ACCESS_COARSE_LOCATION
                      ) == PackageManager.PERMISSION_GRANTED;

                      pendingGeoCallback.invoke(pendingGeoOrigin, locationGranted, false);
                      pendingGeoCallback = null;
                      pendingGeoOrigin = null;
                  }
              }
          }
          EOF


      # ============================================================
      # 11. SINCRONIZAR CAPACITOR
      # ============================================================
      - name: Sincronizar Capacitor
        run: npx cap sync android


      # ============================================================
      # 12. GERAR APK COM GRADLE
      # ============================================================
      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug


      # ============================================================
      # 13. DISPONIBILIZAR APK PARA DOWNLOAD
      # ============================================================
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Notifica-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
